# LAVA Job Definition – ECU-150 ModBSP Watchdog Reboot Test
# This is a SEPARATE job because triggering the watchdog reboots the board,
# which terminates the current LAVA test session.
#
# LAVA handles recovery via auto_login after the reboot.  The test script
# writes the result BEFORE firing the watchdog so LAVA can pick it up
# after the board comes back up.
#
# Config source: conf/ecu-150_modbsp/watchdog/params.yaml
# Fill in device_type and deploy/boot as for the main job.
---
device_type: advantech-ecu-150  # TODO: set to your lab's device type
job_name: "Advantech ECU-150 – Watchdog Reboot"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 15
  action:
    minutes: 5
  connection:
    minutes: 5

metadata:
  source: https://github.com/miketsukerman/test-definitions
  board: ECU-150
  bsp: ModBSP
  test: watchdog-reboot

actions:

  - deploy:
      timeout:
        minutes: 10
      to: tftp
      kernel:
        url: http://images.example.com/ecu-150/Image  # TODO
        type: image
      dtb:
        url: http://images.example.com/ecu-150/ecu-150-modbsp.dtb  # TODO
      ramdisk:
        url: http://images.example.com/ecu-150/rootfs.cpio.gz  # TODO
        compression: gz

  - boot:
      timeout:
        minutes: 5
      method: u-boot
      commands: nfs
      auto_login:
        login_prompt: "login:"
        username: root
      prompts:
        - "root@.*:.*#"
        - "\\$"

  - test:
      timeout:
        minutes: 10
      definitions:
        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/watchdog/watchdog-reboot.yaml
          name: adv-watchdog-reboot
          parameters:
            WATCHDOG_DEV: /dev/watchdog0
            WATCHDOG_TIMEOUT_S: 60
