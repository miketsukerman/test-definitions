# LAVA Job Definition – Advantech ROM5721-1G-DB5901 ModBSP Full QA Suite
# Board: ROM5721-1G-DB5901
# Config source: conf/rom5721-1g-db5901_modbsp/*/params.yaml
#
# USAGE:
#   1. Set device_type to match your LAVA lab's device type name
#   2. Fill in the deploy/boot sections with your lab's image location
#   3. Adjust IPERF3_SERVER_IP if throughput tests are desired
#   4. Submit to LAVA: lava-tool submit-job <server> <this-file>
#
# NOTE: RTC suspend and watchdog reboot tests are in separate job files:
#   - rom5721-1g-db5901-modbsp-rtc-suspend.yaml
#   - rom5721-1g-db5901-modbsp-watchdog-reboot.yaml
---
device_type: advantech-rom5721  # TODO: set to your lab's device type
job_name: "Advantech ROM5721-1G-DB5901 ModBSP Full QA"
visibility: public
priority: medium

timeouts:
  job:
    minutes: 60
  action:
    minutes: 5
  connection:
    minutes: 2

metadata:
  source: https://github.com/miketsukerman/test-definitions
  board: ROM5721-1G-DB5901
  bsp: ModBSP
  cpu: Cortex-A53

tags: []

actions:

  - deploy:
      timeout:
        minutes: 10
      to: tftp                       # TODO: adjust to your lab (tftp/nfs/sata/…)
      kernel:
        url: http://images.example.com/rom5721-1g-db5901/Image  # TODO
        type: image
      dtb:
        url: http://images.example.com/rom5721-1g-db5901/rom5721-1g-db5901-modbsp.dtb  # TODO
      ramdisk:
        url: http://images.example.com/rom5721-1g-db5901/rootfs.cpio.gz  # TODO
        compression: gz

  - boot:
      timeout:
        minutes: 5
      method: u-boot
      commands: nfs              # TODO: adjust to your lab boot method
      auto_login:
        login_prompt: "login:"
        username: root
      prompts:
        - "root@.*:.*#"
        - "\\$"

  - test:
      timeout:
        minutes: 50
      definitions:

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/context/context.yaml
          name: adv-context
          parameters:
            DISTRO_ID: Yocto
            DISTRO_VER: "scarthgap|styhead|walnascar"
            KERNEL_MIN_VER: 6.6
            CPU_MODEL: Cortex-A53
            BIOS_DATE: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/thermal/thermal.yaml
          name: adv-thermal
          parameters:
            THERMAL_COUNT: 1
            TZ0_DEV: thermal_zone0
            TZ0_MIN: 10
            TZ0_MAX: 60

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/cpu/cpu.yaml
          name: adv-cpu
          parameters:
            CPU_MODEL: Cortex-A53
            CPU_NPROC: "2:CQ/WQ"
            CPU_CSTATES: ""
            CPU_SCALING_MIN: 1200000
            CPU_SCALING_MAX: 1600000
            CPU_SCALING_GOVERNORS: "performance powersave"
            CPU_SUSPENSION_STATES: "freeze mem"

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/ram/ram.yaml
          name: adv-ram
          parameters:
            RAM_SLOT_COUNT: 1
            RAM_MIN_AVAIL: 900
            RAM_SLOT0_SIZE: 992
            RAM_SLOT0_SPEED: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/disk/disk.yaml
          name: adv-disk
          parameters:
            DISK_COUNT: 3
            DISK_ROOTFS_MOUNT: "/dev/mmcblk1p2:rw:SD /dev/mmcblk2p2:rw:MMC"
            DISK0_DEV: /dev/mmcblk1
            DISK0_TYPE: SD
            DISK0_SECTORS: 0
            DISK0_MIN_RS: 40
            DISK0_MIN_WS: 10
            DISK1_DEV: /dev/mmcblk2
            DISK1_TYPE: MMC
            DISK1_SECTORS: 15273600
            DISK1_MIN_RS: 100
            DISK1_MIN_WS: 50
            DISK2_DEV: /dev/sda
            DISK2_TYPE: USB
            DISK2_SECTORS: 0
            DISK2_MIN_RS: 100
            DISK2_MIN_WS: 50

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/eth/eth.yaml
          name: adv-eth
          parameters:
            ETH_COUNT: 1
            IPERF3_SERVER_IP: ""
            IPERF3_DURATION: 5
            ETH0_DEV: eth0
            ETH0_BUS: soc
            ETH0_BUS_ID: 30be0000
            ETH0_LINK: 1000
            ETH0_WOL_FEATURED: "y"
            ETH0_WOL_WAKEUP: "n"
            ETH0_MIN_TX_SPEED: 700
            ETH0_MIN_RX_SPEED: 700

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/uart/uart.yaml
          name: adv-uart
          parameters:
            UART_COUNT: 4
            UART0_DEV: /dev/ttymxc0
            UART0_BUS: soc
            UART0_BUS_ID: 30860000
            UART0_HWFC: "y"
            UART0_DEBUG_CONSOLE: "n"
            UART0_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART0_REFERENCE: UART1-M2
            UART1_DEV: /dev/ttymxc1
            UART1_BUS: soc
            UART1_BUS_ID: 30890000
            UART1_HWFC: "n"
            UART1_DEBUG_CONSOLE: "y"
            UART1_LOOPBACK_TEST: skip
            UART1_REFERENCE: UART2-COM3
            UART2_DEV: /dev/ttymxc2
            UART2_BUS: soc
            UART2_BUS_ID: 30880000
            UART2_HWFC: "y"
            UART2_DEBUG_CONSOLE: "n"
            UART2_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART2_REFERENCE: UART3-COM3B
            UART3_DEV: /dev/ttymxc3
            UART3_BUS: soc
            UART3_BUS_ID: 30a60000
            UART3_HWFC: "n"
            UART3_DEBUG_CONSOLE: "n"
            UART3_LOOPBACK_TEST: "9600:2W 921600:2W"
            UART3_REFERENCE: UART4-COM4B

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/i2c/i2c.yaml
          name: adv-i2c
          parameters:
            I2C_COUNT: 4
            I2C0_DEV: /dev/i2c-0
            I2C0_CONTROLLER: 30a20000.i2c
            I2C0_REFERENCE: ""
            I2C1_DEV: /dev/i2c-1
            I2C1_CONTROLLER: 30a30000.i2c
            I2C1_REFERENCE: ""
            I2C2_DEV: /dev/i2c-2
            I2C2_CONTROLLER: 30a40000.i2c
            I2C2_REFERENCE: ""
            I2C3_DEV: /dev/i2c-3
            I2C3_CONTROLLER: 30a50000.i2c
            I2C3_REFERENCE: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/pwm/pwm.yaml
          name: adv-pwm
          parameters:
            PWM_COUNT: 2
            PWM0_DEV: pwmchip0
            PWM0_BUS: soc
            PWM0_BUS_ID: 30670000
            PWM0_REFERENCE: ""
            PWM1_DEV: pwmchip1
            PWM1_BUS: soc
            PWM1_BUS_ID: 30690000
            PWM1_REFERENCE: ""
            PWM_BACKLIGHT_DEV: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/spi/spi.yaml
          name: adv-spi
          parameters:
            SPI_COUNT: 0

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/npu/npu.yaml
          name: adv-npu
          parameters:
            NPU_COUNT: 1

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/can/can.yaml
          name: adv-can
          parameters:
            CAN_COUNT: 0
            CAN_EXT_LOOPBACK: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/gpio/gpio.yaml
          name: adv-gpio
          parameters:
            GPIO_COUNT: 0
            GPIO_PINS: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/usb/usb.yaml
          name: adv-usb
          parameters:
            USB_DEV_COUNT: 2
            USB_OTG_ENABLED: 1
            USB_OTG_CONF: ""
            USB_DEV0_PORT: 1
            USB_DEV0_DRIVER: uas
            USB_DEV0_SPEED: 5000M
            USB_DEV1_PORT: 2
            USB_DEV1_DRIVER: usbhid
            USB_DEV1_SPEED: 1.5M

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/rtc/rtc.yaml
          name: adv-rtc
          parameters:
            RTC_COUNT: 1
            RTC0_DEV: /dev/rtc0
            RTC0_WAKEUP: enabled
            RTC_SUSPEND_DEV: /dev/rtc0
            RTC_SUSPEND_SLEEP_STATE: mem
            RTC_SUSPEND_WAKE_SLEEP_S: 5

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/watchdog/watchdog.yaml
          name: adv-watchdog
          parameters:
            WATCHDOG_COUNT: 1
            WATCHDOG0_DEV: /dev/watchdog0

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/tpm/tpm.yaml
          name: adv-tpm
          parameters:
            TPM_COUNT: 1

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/optee/optee.yaml
          name: adv-optee
          parameters:
            OPTEE_DEV: /dev/tee0

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/gpu/gpu.yaml
          name: adv-gpu
          parameters:
            GPU_COUNT: 0
            GPU_WAYLAND: ""
            GPU_VA_CODECS: ""

        - repository: https://github.com/miketsukerman/test-definitions.git
          from: git
          branch: main
          path: automated/linux/modular-bsp/audio/audio.yaml
          name: adv-audio
          parameters:
            AUDIO_PLAYBACK_COUNT: 0
            AUDIO_CAPTURE_COUNT: 0
